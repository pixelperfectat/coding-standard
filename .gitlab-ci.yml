# This package is consumed over Composer, so a tag that does not publish is a silent failure:
# the tag exists, `composer require` still resolves the previous version, and nothing reports it.
stages:
  - validate
  - release

validate:composer:
  stage: validate
  image: markoshust/magento-php:8.3-fpm
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  script:
    - composer validate --no-check-publish --no-check-lock
    - for f in bin/*.php ci/*.php; do php -l "$f" || exit 1; done

# A caret on a 0.x pin never admits the next minor, so the toolchain can fall a year behind while
# every module stays green. Runs weekly from a pipeline schedule; fails when a newer tool installs
# with the rest of the toolchain and only our own constraint holds it back.
toolchain:drift:
  stage: validate
  image: markoshust/magento-php:8.3-fpm
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
      allow_failure: true
  script:
    - composer update --no-interaction --no-progress --no-scripts
    - php ci/check-toolchain-drift.php

publish:
  stage: release
  image: markoshust/magento-php:8.3-fpm
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  script:
    - |
      curl --fail --silent --show-error \
           --data tag="${CI_COMMIT_TAG}" \
           --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/composer"
    # Assert the postcondition rather than trusting the call above.
    - |
      curl --fail --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages" \
        | grep -q "\"version\":\"${CI_COMMIT_TAG}\"" \
        || { echo "publish reported success but ${CI_COMMIT_TAG} is not in the registry"; exit 1; }
      echo "verified: ${CI_COMMIT_TAG} is in the registry"
